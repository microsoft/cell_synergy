[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data_scaling"
version = "0.1.0"
description = "Data scaling experiments for multimodal self-supervised learning"
authors = [
    {name = "Till Richter", email = "till.richter@helmholtz-muenchen.de"},
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
urls = {Homepage = "https://github.com/theislab/data_scaling/"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "datasets>=2.14.0",
    "hydra-core>=1.3.2",
    "numpy>=1.24.0",
    "pytorch-lightning>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "pylint>=2.17.0",
    "pytest>=7.3.1",
]

[tool.setuptools]
packages = ["data_scaling"]
package-dir = {"data_scaling" = "src"}

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pylint]
max-line-length = 100
disable = ["C0111", "R0801"] 