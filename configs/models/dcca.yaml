method: "dcca"            # Method name for the model
img_embed_dim: 1536         # Input dimension for image embeddings
gex_embed_dim: 512          # Input dimension for gene expression embeddings
projection_dim: 256         # Output dimension of the shared latent space
hidden_dim: 512             # Hidden dimension for projection layers (updated)
dropout: 0.1                # Dropout rate
use_batchnorm: true         # Whether to use batch normalization
activation: "leaky_relu"    # Activation function (updated to match implementation)
use_all_singular_values: false  # Whether to use all singular values in DCCA
checkpoint_path: ""
checkpoint_split: "preL"


