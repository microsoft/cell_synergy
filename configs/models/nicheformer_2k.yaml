# Nicheformer model configuration for 2K donors
model_name: nicheformer
dim_model: 192
nheads: 8
dim_feedforward: 768
nlayers: 4
dropout: 0.0
subset: "nf_2000donors"

# Additional nicheformer parameters
batch_first: true
masking_p: 0.15
n_tokens: 20340
context_length: 1500
warmup: 4000
autoregressive: false
pool: null
supervised_task: false
learnable_pe: true
specie: false
assay: false
modality: false
contrastive: false
