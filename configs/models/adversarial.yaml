method: "adversarial"
gex_encoder: "S"
img_encoder: "S"
projection_dim: 256
discriminator_hidden_dim: 512
adv_loss_weight: 1.0 
img_embed_dim: 1536
gex_embed_dim: 128
checkpoint_path: "lung_adversarial.ckpt"

# GAN-specific hyperparameters (matching CAMEO)
gan_type: "wasserstein"  # or "vanilla"
lr_g: 1e-4  # Generator learning rate
lr_d: 5e-5  # Discriminator learning rate
weight_decay: 1e-4
b1: 0.5  # Beta1 for AdamW
b2: 0.999  # Beta2 for AdamW
clip_value: 0.01  # Weight clipping for Wasserstein GAN

# Loss weights (matching CAMEO)
lambda1: 1.0  # Reconstruction loss weight
lambda3: 0.5  # Adversarial loss weight
lambda_align: 0.1  # Latent alignment loss weight