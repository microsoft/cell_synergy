dataset: "lung"
dataset_name: "lung"

# HuggingFace dataset configuration
hf_datasets:
  # For alignment training (pre-computed embeddings)
  alignment: "microsoft/multimodal_img_st"
  # For other tasks (original dataset)
  original: "theislab-multimodal-ssl/paired-image-gexp-xenium-lungmed55-broadCT6"

multimodal:
  train:
    L: ['VUILD106', 'VUILD107MF', 'VUILD115', 'THD0008', 'VUILD110', 'TILD117MF', 'VUILD96MF', 'VUILD78MF', 'VUILD102LF', 'TILD175', 'VUILD96LF', 'VUILD104LF', 'VUILD48MF', 'TILD117LF', 'VUILD78LF', 'VUHD116B']
  pretrain:
    S: ['VUILD106', 'VUILD107MF']
    M: ['VUILD106', 'VUILD107MF', 'VUILD115', 'THD0008']
    L: ['VUILD106', 'VUILD107MF', 'VUILD115', 'THD0008', 'VUILD110', 'TILD117MF', 'VUILD96MF', 'VUILD78MF']
  finetune:
    S: ['VUILD102LF', 'TILD175']
    M: ['VUILD102LF', 'TILD175', 'VUILD96LF', 'VUILD104LF']
    L: ['VUILD102LF', 'TILD175', 'VUILD96LF', 'VUILD104LF', 'VUILD48MF', 'TILD117LF', 'VUILD78LF', 'VUHD116B']
  test: ['THD0011', 'VUILD91LF', 'VUHD069', 'VUILD105MF', 'VUHD113', 'VUHD116A', 'VUHD095']


gex_pretrain:
  1000_donors: 'nf_1000donors'
  2000_donors: 'nf_2000donors'
  4000_donors: 'nf_4000donors'
  full: 'nf_full'

img_pretrain:
  500K: 'bioptimus/H-optimus-0'
  3M: 'paige-ai/Virchow2'
  100M: 'MahmoodLab/UNI'
  200M: 'MahmoodLab/UNI2-h'
  1B: 'prov-gigapath/prov-gigapath'

train_split: "L"  # S, M, or L
pretrain_split: "L"
finetune_split: "L"
test_split: "L"
stage: "train"  # pretrain, finetune, or test
gex_train_choice: "full"
img_train_choice: "200M"

# HuggingFace dataset paths for alignment training
hf_dataset_paths:
  S: "lung_hf"
  M: "lung_hf"  
  L: "lung_hf"

part_size: 256
buffer_size: 4000000
parts_per_chunk: 4
prealloc_gpu_memory: True
num_workers: 8

# Annotation filtering
annotations:
  excluded_classes: [3, 16]  # Exclude Emphysema (3) and NOANNOT (16)
  exclude_test_only_classes: true  # Exclude classes that only appear in test set

# Cell type composition filtering
cell_types:
  excluded_types: ["NOMAP"]  # Exclude NOMAP from regression
  nomap_index: 9  # Index of NOMAP in the cell type ratio vector

# Annotation filtering
annotations:
  excluded_classes: [3, 16]  # Exclude Emphysema (3) and NOANNOT (16)
  num_classes: 22  # Effective number of classes after filtering

# Cell type composition filtering
cell_types:
  excluded_cell_types: ["NOMAP"]  # Exclude NOMAP from cell type composition
  # Note: This will be handled during data loading by filtering out samples with NOMAP