# Downstream evaluation training configurations
classification:
  batch_size: 512
  max_epochs: 100
  early_stopping_patience: 10
  learning_rate: 0.001
  weight_decay: 1e-5
  seed: 42
  label_key: "annotation"
  early_stopping_patience: 5

regression:
  batch_size: 512
  max_epochs: 100
  early_stopping_patience: 10
  learning_rate: 0.0001
  weight_decay: 1e-5
  seed: 42
  label_key: "cell_type_ratio"
  early_stopping_patience: 5

spatial_neighbor:
  num_bins: 10
  distance_metric: "euclidean"
  task_type: "regression"  # or "classification"
  summary_strategy: "mean"
  seed: 42
